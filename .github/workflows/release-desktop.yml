name: Build & Release Desktop Clients

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go client binaries
        run: |
          cd desktop
          chmod +x build.sh
          ./build.sh
          cp snispoof-client-windows-amd64.exe dist/snispoof-client.exe 2>/dev/null || cp dist/snispoof-client-windows-amd64.exe dist/snispoof-client.exe
          cp dist/snispoof-client-linux-arm64 dist/snispoof-client-termux-arm64

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*
            desktop/snispoof-client.bat
            desktop/snispoof-client.ps1
            desktop/snispoof-client.py
